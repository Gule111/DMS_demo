server:
  port: 8080

spring:
  application:
    name: dms-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # DataSource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# DMS config
dms:
  jwt:
    secret: ${JWT_SECRET}
    # Token expiration: Access Token (2h), Refresh Token (7d)
    expiration: 7200000
    refresh-expiration: 604800000
  redis:
    quota-key-prefix: "dms:quota:"
    token-key-prefix: "dms:token:"
    sms-code-key-prefix: "dms:sms:code:"
    # SMS code expire in seconds (5min)
    sms-code-expire: 300
  qiniu:
    access-key: ${QINIU_ACCESS_KEY}
    secret-key: ${QINIU_SECRET_KEY}
    bucket: ${QINIU_BUCKET}
    domain: ${QINIU_DOMAIN}
